[package]
name = "tpt-crucible-uir-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ComputationalGraph -> TPT-UIR ingestion adapter for tpt-crucible (Phase 3 of tpt-uir)"

[dependencies]
# Cross-repo path deps into the sibling `tpt-uir` workspace. These can be
# switched to git deps once `tpt-uir` is published.
tpt-uir-core = { path = "../../../tpt-uir/crates/tpt-uir-core", features = ["serde"] }
tpt-uir-dialects = { path = "../../../tpt-uir/crates/tpt-uir-dialects" }
tpt-uir-serde = { path = "../../../tpt-uir/crates/tpt-uir-serde", features = ["std"] }
tpt-catalyst = { path = "../tpt-catalyst" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
