[package]
name = "tpt-crucible-alloy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Swarm backend for the TPT Crucible suite: topology-aware distributed graph partitioning, KV-cache planning, and firmware generation for microcontroller swarms"
documentation = "https://docs.rs/tpt-crucible-alloy"
readme = "README.md"
keywords = ["swarm", "esp32", "partitioning", "ai", "embedded"]
categories = ["compilers", "embedded"]

[dependencies]
tpt-crucible-common = { workspace = true }
petgraph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
# Compile-time firmware/script templates (spec2.txt section 3.4).
askama = "0.12"
# Host-side serial heartbeat bridge (`serial` feature): reads node frames
# off a real wire into the failure detector. Native-only, opt-in.
serialport = { version = "4", optional = true, default-features = false }

[dev-dependencies]
# Software-in-the-loop end-to-end test: real GGUF ingestion feeding the
# planner/engine/pipeline stack.
tpt-crucible-catalyst = { workspace = true }

[features]
serial = ["dep:serialport"]

[[example]]
name = "heartbeat_live"
required-features = ["serial"]

[lints]
workspace = true
