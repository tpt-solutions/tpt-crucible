[package]
name = "tpt-crucible-observer-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cyberpunk-industrial Wasm dashboard for the TPT Crucible Observer telemetry backend"
documentation = "https://docs.rs/tpt-crucible-observer-web"
readme = "README.md"
keywords = ["dashboard", "wasm", "leptos", "telemetry", "websocket"]
categories = ["visualization", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pure-client (CSR) Leptos app; served by any static file server built
# through trunk (`trunk serve` / `trunk build --release`).
# Pinned while the dashboard is small - 0.7+ removed `Scope`/`cx`.
leptos = "0.8"
console_error_panic_hook = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "WebSocket",
    "MessageEvent",
    "ErrorEvent",
    "CloseEvent",
] }

[lints]
workspace = true