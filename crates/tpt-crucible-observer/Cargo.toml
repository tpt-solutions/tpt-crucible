[package]
name = "tpt-crucible-observer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Real-time telemetry backend for the TPT Crucible suite: WebSocket streams of tokens/sec, memory bandwidth, thermal drift, and node latency"
documentation = "https://docs.rs/tpt-crucible-observer"
readme = "README.md"
keywords = ["telemetry", "websocket", "monitoring", "ai", "dashboard"]
categories = ["web-programming::http-server", "development-tools"]

[dependencies]
tpt-crucible-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["ws", "tokio", "http1"] }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "sync"] }
futures-util = "0.3"

[dev-dependencies]
tokio-tungstenite = "0.24"

[lints]
workspace = true
