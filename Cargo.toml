[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-crucible"
authors = ["TPT Solutions"]

[workspace.dependencies]
# Internal crates (path-only until first crates.io release; see todo.md).
tpt-crucible-common = { path = "crates/tpt-crucible-common" }
tpt-crucible-catalyst = { path = "crates/tpt-crucible-catalyst" }
tpt-crucible-alloy = { path = "crates/tpt-crucible-alloy" }
tpt-crucible-fusion = { path = "crates/tpt-crucible-fusion" }
tpt-crucible-element = { path = "crates/tpt-crucible-element" }
tpt-crucible-observer = { path = "crates/tpt-crucible-observer" }

# Serialization (pure Rust, wasm-compatible).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling.
thiserror = "2.0"

# Graph algorithms (Alloy partitioning).
petgraph = "0.6"

# CLI argument parsing.
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }