[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-crucible"
authors = ["TPT Solutions"]

[workspace.dependencies]
# Internal crates. `version` is declared so `cargo publish --dry-run` (and
# the eventual real publish) resolves them; path wins during local builds.
tpt-crucible-common = { path = "crates/tpt-crucible-common", version = "0.1.0" }
tpt-crucible-catalyst = { path = "crates/tpt-crucible-catalyst", version = "0.1.0" }
tpt-crucible-alloy = { path = "crates/tpt-crucible-alloy", version = "0.1.0" }
tpt-crucible-fusion = { path = "crates/tpt-crucible-fusion", version = "0.1.0" }
tpt-crucible-element = { path = "crates/tpt-crucible-element", version = "0.1.0" }
tpt-crucible-observer = { path = "crates/tpt-crucible-observer", version = "0.1.0" }
tpt-crucible-uir-adapter = { path = "crates/tpt-crucible-uir-adapter", version = "0.1.0" }

# Serialization (pure Rust, wasm-compatible).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling.
thiserror = "2.0"

# Graph algorithms (Alloy partitioning).
petgraph = "0.6"

# CLI argument parsing.
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }